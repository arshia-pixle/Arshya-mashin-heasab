
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arshia Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111827;
            font-family: Arial, sans-serif;
            color: white;
            padding: 20px;
        }

        .calculator {
            width: 100%;
            max-width: 380px;
            background: #1f2937;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.3);
        }

        h2 {
            text-align: center;
            margin-top: 0;
            color: #60a5fa;
        }

        .subtitle {
            text-align: center;
            color: #9ca3af;
            font-size: 13px;
            margin-top: -10px;
            margin-bottom: 25px;
        }

        input, select, button {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            border: none;
            border-radius: 9px;
            font-size: 16px;
        }

        input, select {
            background: #374151;
            color: white;
            outline: none;
        }

        button {
            background: #2563eb;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #result {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            margin-top: 15px;
            color: #34d399;
            overflow-wrap: anywhere;
        }

        .signature {
            border-top: 1px solid #374151;
            margin-top: 25px;
            padding-top: 15px;
            text-align: center;
            color: #9ca3af;
            font-size: 12px;
        }

        .signature strong {
            display: block;
            color: #60a5fa;
            font-size: 15px;
            margin: 7px;
        }

        .signature span {
            font-size: 10px;
            color: #6b7280;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <h2>Arshia Calculator</h2>

        <p class="subtitle">پروژه عرشیا قاسمی</p>

        <input type="number" id="a" placeholder="Enter first number">

        <select id="op">
            <option value="+">Addition (+)</option>
            <option value="-">Subtraction (-)</option>
            <option value="*">Multiplication (*)</option>
            <option value="/">Division (/)</option>
        </select>

        <input type="number" id="b" placeholder="Enter second number">

        <button onclick="calculate()">Calculate</button>

        <div id="result"></div>

        <div class="signature">
            <p>تکلیف استاد نعمت الله</p>
            <p>Designed & Developed by</p>
            <strong>Arshia Ghasemi</strong>
            <span>© 2026</span>
        </div>

    </div>

    <script>
        async function calculate() {
            const a = document.getElementById("a").value;
            const b = document.getElementById("b").value;
            const op = document.getElementById("op").value;
            const resultBox = document.getElementById("result");

            if (a === "" || b === "") {
                resultBox.style.color = "#f87171";
                resultBox.innerText = "Please enter both numbers!";
                return;
            }

            try {
                const response = await fetch("/calculate", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        a: a,
                        b: b,
                        op: op
                    })
                });

                const data = await response.json();

                if (data.error) {
                    resultBox.style.color = "#f87171";
                    resultBox.innerText = data.error;
                } else {
                    resultBox.style.color = "#34d399";
                    resultBox.innerText = "Result: " + data.result;
                }

            } catch (error) {
                resultBox.style.color = "#f87171";
                resultBox.innerText = "Something went wrong!";
            }
        }
    </script>

</body>
</html>
